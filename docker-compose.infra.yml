networks:
  ecommerce-net:
    name: ecommerce-net
    driver: bridge

services:
  apisix:
    image: apache/apisix:3.17.0-debian
    container_name: apisix
    volumes:
      - ./apisix_conf/config.yaml:/usr/local/apisix/conf/config.yaml:ro
      - ./apisix_conf/apisix.yaml:/usr/local/apisix/conf/apisix.yaml:ro
    env_file:
      - .env
    ports:
      - "${APISIX_HTTP_PORT}:9080"
      - "${APISIX_ADMIN_PORT}:9180"
    networks:
      - ecommerce-net
