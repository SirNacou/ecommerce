routes:
  - id: user-service-route
    name: "user-service-route"
    uri: "/user.v1.UserService/*"
    methods: [POST, OPTIONS]
    plugins:
      cors:
        allow_origins: "**"
        allow_methods: "GET,POST,PUT,DELETE,OPTIONS"
    upstream:
      type: roundrobin
      nodes:
        "${{USER_SERVICE_HOST}}:${{USER_SERVICE_PORT}}": 1

  - id: catalog-service-route
    name: "catalog-service-route"
    uri: "/catalog.v1.CatalogService/*"
    methods: [POST, OPTIONS]
    plugins:
      cors:
        allow_origins: "**"
        allow_methods: "GET,POST,PUT,DELETE,OPTIONS"
    upstream:
      type: roundrobin
      nodes:
        "${{CATALOG_SERVICE_HOST}}:${{CATALOG_SERVICE_PORT}}": 1
#END
