routes:
  - id: user-service-route
    name: "user-service-route"
    uri: "/user.v1.UserService/*"
    methods: [GET, POST, OPTIONS]
    plugins:
      cors:
        allow_origins: "*"
        allow_methods: "GET,POST,OPTIONS"
        allow_headers: "Content-Type,Authorization,connect-protocol-version,x-grpc-web,x-user-agent"
        expose_headers: "grpc-status,grpc-message,connect-error-code"
        max_age: 3600
    upstream:
      type: roundrobin
      nodes:
        "${{USER_SERVICE_HOST}}:${{USER_SERVICE_PORT}}": 1

