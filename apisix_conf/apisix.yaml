routes:
  - id: user-service-route
    name: "user-service-route"
    uri: "/user.v1.UserService/*"
    methods:
      - POST
      - OPTIONS
    plugins:
      cors:
        allow_origins: "**"
        allow_methods: "GET,POST,PUT,DELETE,OPTIONS"
        allow_headers: "**"
        expose_headers: "**"
        max_age: 3600
    upstream:
      type: roundrobin
      nodes:
        "${{USER_SERVICE_HOST}}:${{USER_SERVICE_PORT}}": 1
#END
