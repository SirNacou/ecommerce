networks:
  ecommerce-net:
    external: true

services:
  catalog_postgres:
    image: postgres:18-alpine
    container_name: catalog_service_postgres
    env_file:
      - .env
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - catalog_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 5
    networks:
      - ecommerce-net

  catalog_migrations:
    image: kukymbr/goose-docker:3.27.2
    container_name: catalog_service_migrations
    volumes:
      - ./migrations:/migrations
    env_file:
      - .env
    entrypoint:
      - goose
      - -dir
      - /migrations
      - postgres
      - "${DATABASE_URL}"
      - up
    depends_on:
      catalog_postgres:
        condition: service_healthy
    networks:
      - ecommerce-net

  catalog-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: catalog-service
    ports:
      - "${PORT}:${PORT}"
    env_file:
      - .env
    depends_on:
      catalog_postgres:
        condition: service_healthy
      catalog_migrations:
        condition: service_completed_successfully
    networks:
      - ecommerce-net

volumes:
  catalog_postgres_data:
