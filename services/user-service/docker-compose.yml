networks:
  ecommerce-net:
    external: true

services:
  postgres:
    image: postgres:18-alpine
    container_name: user_service_postgres
    env_file:
      - .env
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 5
    networks:
      - ecommerce-net

  migrations:
    image: kukymbr/goose-docker:3.27.2
    container_name: user_service_migrations
    volumes:
      - ./migrations:/migrations
    env_file:
      - .env
    entrypoint:
      - goose
      - -dir
      - /migrations
      - postgres
      - "${DATABASE_URL}"
      - up
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ecommerce-net

  user-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: user-service
    ports:
      - "${PORT}:${PORT}"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    networks:
      - ecommerce-net

volumes:
  postgres_data:
