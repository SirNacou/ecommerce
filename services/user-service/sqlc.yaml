version: "2"
sql:
  - schema: "migrations"
    engine: "postgresql"
    queries: "internal/infrastructure/persistence/postgres/queries"
    gen:
      go:
        package: "db"
        out: "internal/infrastructure/persistence/postgres/db"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_interface: true
        emit_empty_slices: true
        emit_pointers_for_null_types: true
        overrides:
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
          - db_type: "timestamptz"
            go_type:
              import: "time"
              type: "Time"
          - db_type: "timestamptz"
            go_type:
              import: "time"
              type: "Time"
              pointer: true
            nullable: true
